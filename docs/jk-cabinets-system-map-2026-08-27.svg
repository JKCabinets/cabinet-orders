<svg viewBox="0 0 1400 1520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#8a8578"/></marker>
    <marker id="arrowTerra" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#b06a4a"/></marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #2a2a2a; }
      .subtitle { font-size: 14px; fill: #8a8578; }
      .zone { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #b0a89a; }
      .zoneRed { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #b06a4a; }
      .box-title { font-size: 15px; font-weight: 700; fill: #2a2a2a; }
      .box-sub { font-size: 11.5px; fill: #6a6a6a; }
      .box-sub-em { font-size: 11.5px; fill: #b06a4a; font-weight: 600; }
      .legend { font-size: 12px; fill: #4a4a4a; }
      .new { font-size: 9px; font-weight: 700; fill: #b06a4a; letter-spacing: 1px; }
      .warn { font-size: 12px; fill: #9a5a3a; }
      .flowsub { font-size: 11.5px; fill: #4a4a4a; }
      .ptr { font-size: 12px; fill: #5a7ab0; font-weight: 600; }
    </style>
  </defs>
  <rect width="1400" height="1520" fill="#faf9f6"/>
  <text x="50" y="55" class="title">JK Cabinets OMS — System Map</text>
  <text x="50" y="80" class="subtitle">Next.js 16 · Supabase · Kamal → Docker → Hetzner CPX31 · ordersjkcabinets2you.com · as of 2026-08-27</text>
  <rect x="960" y="30" width="390" height="62" rx="8" fill="#f4efe6" stroke="#d8c8b0" stroke-width="1.5"/>
  <text x="974" y="49" class="new">TERRACOTTA = UNVERIFIED, EXPIRING, OR KNOWN WRONG</text>
  <text x="974" y="67" class="box-sub">This map draws SYSTEMS AND WIRING ONLY.</text>
  <text x="974" y="84" class="ptr">Model, pipelines, gates, SLA → OMS-STATE §2–§5</text>
  <line x1="50" y1="106" x2="1350" y2="106" stroke="#e0ddd4" stroke-width="2"/>
  <text x="50" y="140" class="zone">EXTERNAL SERVICES</text>
  <rect x="50" y="156" width="286" height="128" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="64" y="181" class="box-title">Shopify</text>
  <text x="64" y="201" class="box-sub">orders/create · orders/updated</text>
  <text x="64" y="218" class="box-sub">orders/delete · app-owned subs</text>
  <text x="64" y="235" class="box-sub">in: HMAC webhook, constant-time</text>
  <text x="64" y="252" class="box-sub">out: Production Stage note + tags</text>
  <text x="64" y="269" class="box-sub-em">⚠ only the FIRST group of a checkout</text>
  <text x="64" y="286" class="box-sub-em">carries shopify_id — writeback</text>
  <text x="64" y="303" class="box-sub-em">reaches one group, not the project</text>
  <rect x="388" y="156" width="286" height="128" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="402" y="181" class="box-title">Avis Plus API</text>
  <text x="402" y="201" class="box-sub">public-api.avisplus.io/api/public/v1</text>
  <text x="402" y="218" class="box-sub">/option-sets · 60 req/min</text>
  <text x="402" y="235" class="box-sub">keyed on stable value_id</text>
  <text x="402" y="252" class="box-sub">feeds sku_mappings via cron</text>
  <text x="402" y="269" class="box-sub-em">⚠ AVIS_API_TOKEN never rotated</text>
  <rect x="726" y="156" width="286" height="128" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="740" y="181" class="box-title">healthchecks.io</text>
  <text x="740" y="201" class="box-sub">dead-man's switch, deliberately</text>
  <text x="740" y="218" class="box-sub">OFF-BOX — a box outage cannot</text>
  <text x="740" y="235" class="box-sub">silence its own alarm</text>
  <text x="740" y="252" class="box-sub">4 cron jobs = 4 real checks</text>
  <text x="740" y="269" class="box-sub-em">⚠ 11 checks exist; 7 are strays</text>
  <text x="740" y="286" class="box-sub-em">⚠ delete BY NAME — jk-webhook-</text>
  <text x="740" y="303" class="box-sub-em">health shares the jk- prefix</text>
  <rect x="1064" y="156" width="286" height="128" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="1078" y="181" class="box-title">Microsoft 365 / Graph</text>
  <text x="1078" y="201" class="box-sub">app-only Mail.Send</text>
  <text x="1078" y="218" class="box-sub">no-reply@ shared mailbox</text>
  <text x="1078" y="235" class="box-sub">ApplicationAccessPolicy scoped</text>
  <text x="1078" y="252" class="box-sub-em">⚠ client secret expiry UNRECORDED</text>
  <text x="1078" y="269" class="box-sub-em">⚠ configured, but NOTHING SENDS</text>
  <text x="1078" y="286" class="box-sub">yet — see OPERATIONS §2</text>
  <rect x="50" y="300" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="64" y="325" class="box-title">Help Scout</text>
  <text x="64" y="345" class="box-sub">email · live chat · knowledge base</text>
  <text x="64" y="362" class="box-sub">Beacon replaces Tidio</text>
  <text x="64" y="379" class="box-sub">Reply-To target for notifications</text>
  <text x="64" y="396" class="box-sub">no order sync — lookup only</text>
  <text x="64" y="413" class="box-sub-em">⚠ first charge 2026-09-02</text>
  <rect x="388" y="300" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="402" y="325" class="box-title">GitHub + GHCR</text>
  <text x="402" y="345" class="box-sub">source, and the image registry</text>
  <text x="402" y="362" class="box-sub">kamal pulls from ghcr.io</text>
  <text x="402" y="379" class="box-sub">image tag = the commit SHA —</text>
  <text x="402" y="396" class="box-sub">that is how a deploy is verified</text>
  <text x="402" y="413" class="box-sub-em">⚠ PAT expires → denied: denied</text>
  <rect x="726" y="300" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="740" y="325" class="box-title">Upstash Redis</text>
  <text x="740" y="345" class="box-sub">rate limiting · free tier · ~301/mo</text>
  <text x="740" y="362" class="box-sub-em">⚠ FAILS OPEN on a transient error,</text>
  <text x="740" y="379" class="box-sub">deliberately — see lib/auth.ts</text>
  <text x="740" y="396" class="box-sub-em">⚠ keyed by ${bucket}:${ip}, so one</text>
  <text x="740" y="413" class="box-sub-em">office IP shares one allowance</text>
  <rect x="1064" y="300" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="1078" y="325" class="box-title">GoDaddy</text>
  <text x="1078" y="345" class="box-sub">DNS for both domains</text>
  <text x="1078" y="362" class="box-sub">jkcabinets2you.com — storefront,</text>
  <text x="1078" y="379" class="box-sub-em">NOT YET LIVE</text>
  <text x="1078" y="396" class="box-sub">ordersjkcabinets2you.com — the OMS</text>
  <text x="1078" y="413" class="box-sub">renewals: Jan and Apr 2027</text>
  <text x="50" y="452" class="zone">THE APPLICATION — one Hetzner CPX31, every request through proxy.ts</text>
  <rect x="50" y="468" width="1300" height="196" rx="10" fill="#fdfcfa" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="66" y="493" class="box-title">kamal-proxy v0.9.2</text>
  <text x="66" y="513" class="box-sub">TLS termination · automatic certificates · health check /api/health every 5s · --buffer-requests --buffer-responses</text>
  <text x="66" y="531" class="box-sub">Keeps 5 old containers — that is the practical rollback window. ⚠ Logs rotate at 10 MB and are shipped nowhere: a zero from a log grep proves nothing.</text>
  <line x1="66" y1="546" x2="1334" y2="546" stroke="#e8e4da" stroke-width="1"/>
  <text x="66" y="570" class="box-title">proxy.ts — the gate (Next 16's renamed middleware)</text>
  <text x="66" y="590" class="box-sub">PUBLIC_PATHS: /login · /api/auth · /api/shopify/webhook · /api/webhooks · /api/cron · /api/csp-report · /api/health</text>
  <text x="66" y="608" class="box-sub">ADMIN_PREFIXES (API only, NOT /admin/* pages): /api/admin · /api/shopify/sync · /api/shopify/orders</text>
  <text x="66" y="626" class="box-sub">Both match on a / boundary, so /api/health-summary correctly does NOT match the public /api/health.</text>
  <text x="66" y="650" class="ptr">Routes, pages, shared modules and every stage gate → OMS-STATE. Auth, credentials and what expires → OPERATIONS §5.</text>
  <text x="50" y="700" class="zone">DATA — Supabase: Postgres + RLS + Realtime + Storage</text>
  <rect x="50" y="716" width="1300" height="150" rx="10" fill="#fdfcfa" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="66" y="741" class="box-title">projects → orders</text>
  <text x="66" y="761" class="box-sub">A checkout is a PROJECT; its lines split by vendor into one `orders` row per CATEGORY. Money and ownership live on the project.</text>
  <text x="66" y="779" class="ptr">⚠ The model is the thing this map used to get wrong. It lives in OMS-STATE §2 and is not redrawn here.</text>
  <line x1="66" y1="794" x2="1334" y2="794" stroke="#e8e4da" stroke-width="1"/>
  <text x="66" y="818" class="box-sub">order_activity (append-only) · order_attachments (kind: general | proof_of_delivery) · order_acknowledgments (+ lines_fingerprint, 2026-08-27)</text>
  <text x="66" y="836" class="box-sub">sku_mappings · team_members (password_hash SELECT revoked) · damage_reports · vendors · shopify_products</text>
  <text x="66" y="856" class="box-sub-em">⚠ Accepted risk: qual=true SELECT on orders / team_members for authenticated — required by Realtime. Public routes MUST use a separate public_api role.</text>
  <text x="50" y="902" class="zone">SCHEDULED JOBS — host crontab → ~/cron-jobs/run-cron.sh → the app over the www URL → healthchecks ping</text>
  <rect x="50" y="918" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="64" y="943" class="box-title">07:30 sync-avis-catalog</text>
  <text x="64" y="963" class="box-sub">reconciles sku_mappings drift</text>
  <text x="64" y="980" class="box-sub">logs new values, renames, orphans</text>
  <text x="64" y="997" class="box-sub">never writes sku_code, never</text>
  <text x="64" y="1014" class="box-sub">deletes, refuses an empty catalog</text>
  <rect x="388" y="918" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="402" y="943" class="box-title">08:00 production-complete</text>
  <text x="402" y="963" class="box-sub">In production → At cross dock when</text>
  <text x="402" y="980" class="box-sub">production_est_finish_date ≤ today</text>
  <text x="402" y="997" class="box-sub">sole owner of that advance</text>
  <text x="402" y="1014" class="box-sub-em">⚠ 08:00 UTC is 1am Phoenix — the</text>
  <text x="402" y="1031" class="box-sub-em">planned notification would send then</text>
  <rect x="726" y="918" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="740" y="943" class="box-title">14:00 wkdys teams-digest</text>
  <text x="740" y="963" class="box-sub">covers every order type</text>
  <text x="740" y="980" class="box-sub">sends even when all is well — a</text>
  <text x="740" y="997" class="box-sub">digest that only arrives with bad</text>
  <text x="740" y="1014" class="box-sub">news looks like one that has stopped</text>
  <text x="740" y="1031" class="box-sub-em">⚠ silent until TEAMS_WEBHOOK_URL set</text>
  <rect x="1064" y="918" width="286" height="112" rx="8" fill="#fff" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="1078" y="943" class="box-title">:20 hourly webhook-health</text>
  <text x="1078" y="963" class="box-sub">asks Shopify for its newest orders</text>
  <text x="1078" y="980" class="box-sub">and confirms the OMS has them</text>
  <text x="1078" y="997" class="box-sub">15-min grace for in-flight deliveries</text>
  <text x="1078" y="1014" class="box-sub">caught a real missed order 2026-08-20</text>
  <text x="50" y="1068" class="zone">FLOWS THAT CROSS A SYSTEM BOUNDARY</text>
  <rect x="50" y="1084" width="1300" height="234" rx="10" fill="#fdfcfa" stroke="#d8d3c8" stroke-width="1.5"/>
  <text x="66" y="1110" class="flowsub">Shopify order → /api/shopify/webhook (HMAC) → split by line-item vendor → one project + one orders row per category.</text>
  <text x="66" y="1132" class="flowsub">Manufacturer .xlsx acknowledgment → /api/orders/[id]/acknowledgment → reconciled against the order's lines → green or a discrepancy list.</text>
  <text x="66" y="1154" class="box-sub-em">⚠ A green acknowledgment stores a FINGERPRINT of what it matched. If the order changes afterwards the gate blocks and asks for a fresh one.</text>
  <text x="66" y="1176" class="flowsub">Tracking number → "Shipped", by EITHER door: typed in the modal, or carried on a Shopify fulfilment. The number is the rule, not the door.</text>
  <text x="66" y="1198" class="box-sub-em">⚠ Samples: the shipping label is bought in Shopify, so the fulfilment is the primary door. Hardware: the vendor supplies the number and whether it reaches Shopify is UNDECIDED.</text>
  <text x="66" y="1220" class="flowsub">Stage change → shopifyStageSync → Production Stage note + merged tags. Custom jobs never sync. Only the group holding shopify_id can.</text>
  <text x="66" y="1242" class="flowsub">Any orders write → Supabase Realtime → the store → every page. ⚠ A realtime payload carries the row only, never a joined table.</text>
  <text x="66" y="1264" class="flowsub">Each cron run → run-cron.sh validates the ping URL, then pings healthchecks.io. A malformed URL goes to stderr, which cron mails.</text>
  <text x="66" y="1286" class="box-sub-em">⚠ The job's exit status is untouched by ping failures. Monitoring must never break the thing it monitors.</text>
  <text x="66" y="1308" class="flowsub">Notifications: Graph is configured and scoped, and NOTHING SENDS. The order confirmation already promises one. See OPERATIONS §2.</text>
  <text x="50" y="1360" class="zoneRed">WHERE THE FACTS LIVE — this map is not one of them</text>
  <rect x="50" y="1376" width="1300" height="104" rx="10" fill="#f4efe6" stroke="#d8c8b0" stroke-width="1.5"/>
  <text x="66" y="1404" class="ptr">The document split lives in OPERATIONS, in the header block above §1, and ONLY there.</text>
  <text x="66" y="1426" class="box-sub">Restating it here would make this the fourth copy — and a four-row summary of a six-row table is how the copies start to disagree.</text>
  <text x="66" y="1450" class="box-sub-em">⚠ This map draws external services, the box, and flows that cross a system boundary. Nothing that another document owns.</text>
  <text x="66" y="1470" class="box-sub-em">The 2026-08-20 version also drew the model, the pipelines, the SLA table and a failure register. Those had drifted two weeks in a fortnight.</text>
</svg>
